name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Surface the failing assertions as check annotations, which stay
            # readable through the API even when the raw log cannot be opened.
            grep -E "^(not ok|✖)|AssertionError|Error:|timed out" test-output.log | head -40 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
            tail -80 test-output.log
            exit $status
          fi
          cat test-output.log

      - name: Fail if committed artifacts are stale
        run: git diff --exit-code -- index.js runner.js stages.js verify.js client.js
